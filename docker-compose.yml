# ระบบทุนการศึกษา (csmju-scholarship) — มี api และฐานข้อมูลของตัวเอง
# ไม่ต่อฐานข้อมูลของ Core Hub เด็ดขาด ต่อแค่ Core Hub API และ JWKS
#
#   docker compose up -d db              PostgreSQL อย่างเดียว สำหรับ `pnpm dev` (พอร์ต 5433)
#   docker compose up -d --build         db + api + web แบบเดียวกับที่ server รัน
#                                        -> http://localhost:3227
#
# server ไม่ได้ใช้ไฟล์นี้ — DevOps รัน image สองตัวเดียวกันกับ PostgreSQL ตัวกลาง (standards docs/deployment.md)
# ไฟล์นี้จำลองแบบนั้นในเครื่อง · ชื่อ service เป็นส่วนหนึ่งของสัญญา: image ของ web ส่ง /api/* และ /auth/* ไปที่ http://api:4000

# ล็อกแบบเดียวกับ server (deployment.md ข้อ 6): ระบบไฟล์อ่านอย่างเดียว · ไม่มี Linux capability ·
# RAM เท่า server · หมุน log — โค้ดที่เขียนไฟล์นอก /tmp หรือใช้ RAM เกินจะพังที่นี่ก่อน
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  db:
    image: postgres:16-alpine
    container_name: csmju-scholarship-db
    restart: unless-stopped
    environment:
      # ใช้ในเครื่องเท่านั้น — บน server DevOps สร้างฐานข้อมูลและ role ให้
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scholarship_db
    ports:
      # 5433 ที่เครื่อง host ไม่ชนกับ PostgreSQL ที่ลงไว้ในเครื่อง (5432)
      - '127.0.0.1:5433:5432'
    volumes:
      - csmju-scholarship-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d scholarship_db']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: csmju-scholarship-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/scholarship_db?schema=public
      DATABASE_POOL_MAX: 5
      CORE_HUB_URL: ${CORE_HUB_URL:-https://csmju2030.jowave.com}
      CORE_HUB_JWKS_URL: ${CORE_HUB_JWKS_URL:-https://csmju2030.jowave.com/api/v1/.well-known/jwks.json}
      # เว็บของ Core Hub ตามที่ "browser" เข้าถึง (/auth/login redirect ไปที่นี่)
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-https://csmju2030.jowave.com}
      CORE_HUB_ISSUER: ${CORE_HUB_ISSUER:-core-hub}
      CORE_HUB_AUDIENCE: ${CORE_HUB_AUDIENCE:-csmju2030}
      SUBSYSTEM_ID: ${SUBSYSTEM_ID:-csmju-scholarship}
      TZ: Asia/Bangkok
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    # ไม่เปิดพอร์ต: browser เข้าถึง api ผ่าน web เท่านั้น (/api/*, /auth/*)
    extra_hosts:
      # ใช้พอร์ทัลจำลองในเครื่อง: ตั้ง CORE_HUB_* เป็น http://host.docker.internal:<พอร์ต>
      - 'host.docker.internal:host-gateway'

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: csmju-scholarship-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:size=32m
      # cache ของ next/image
      - /app/frontend/.next/cache:size=64m
    mem_limit: 384m
    environment:
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-https://csmju2030.jowave.com}
      SUBSYSTEM_ID: ${SUBSYSTEM_ID:-csmju-scholarship}
      TZ: Asia/Bangkok
    ports:
      # callback ที่ลงทะเบียนใน Core Hub คือ http://localhost:3227/auth/callback
      - '127.0.0.1:3227:3000'

volumes:
  csmju-scholarship-db-data:
