# รันทั้งระบบด้วย Docker (ต้องมี Core Hub รันอยู่ที่เครื่อง host แล้ว)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scholarship_db
      POSTGRES_USER: ${POSTGRES_USER:-scholarship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scholarship}:${POSTGRES_PASSWORD}@db:5432/scholarship_db?schema=public
      CORE_HUB_URL: ${CORE_HUB_URL:-http://host.docker.internal:3000}
    volumes:
      - uploads:/repo/backend/uploads
    depends_on:
      - db
    ports:
      - "4227:4227"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:4227
    depends_on:
      - backend
    ports:
      - "3227:3227"

volumes:
  db-data:
  uploads:
